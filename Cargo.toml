[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
authors = ["Karol Nowicki <oddech-dev@stsai.pl>"]
rust-version = "1.90"

[workspace.dependencies]
oddech-core = { path = "crates/oddech-core" }
oddech-media = { path = "crates/oddech-media" }
oddech-playback = { path = "crates/oddech-playback" }
oddech-detect = { path = "crates/oddech-detect" }

anyhow = "1"
arc-swap = "1.9"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.36"
env_logger = "0.11"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
hound = "3.5"
log = "0.4"
memmap2 = "0.9"
parking_lot = "0.12"
rayon = "1.12"
realfft = "3.5"
rfd = "0.17"
rtrb = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
